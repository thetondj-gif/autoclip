name: DAWN integration acceptance

on:
  pull_request:
    paths:
      - 'dawn-integration/**'
      - '.github/workflows/dawn-integration-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Run secret-free acceptance
        run: python dawn-integration/acceptance.py
